server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name eufit.duckdns.org 136.114.199.181 _;

    access_log /var/log/nginx/eufit.access.log;
    error_log  /var/log/nginx/eufit.error.log;

    location /static/ {
        alias /home/jurandir_fisico/eufit/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
