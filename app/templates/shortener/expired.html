{% extends "layouts/menu.html" %}

{% block title %}Expired Link — EUFit{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-8 backdrop-blur-md text-center shadow-2xl relative z-10">
    <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-3xl mx-auto mb-4">
        ⏱️
    </div>
    <h1 class="text-xl font-bold text-slate-100 mb-2">Expired Link</h1>
    <p class="text-xs text-slate-400 mb-6 leading-relaxed">
        This shortened link (<code class="text-amber-300 font-mono">/{{ code }}</code>) was a temporary guest link and has expired (15-minute time limit).
    </p>

    <div class="flex flex-col gap-2">
        <a href="{{ url_for('shortener.index') }}" class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-lg shadow-blue-600/30 transition-all">
            Shorten a new link
        </a>
        <a href="{{ url_for('dashboard.home') }}" class="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium transition-all">
            Go to Main Menu
        </a>
    </div>
</div>
{% endblock %}
