<!-- ~/EUFit/app/templates/layouts/menu.html -->
<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EUFit{% endblock %}</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg:     '#0f172a',
                        cardBg:     '#1e293b',
                        accentBlue: '#3b82f6',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-slate-950 font-sans text-slate-100 antialiased">

    <div class="w-full min-h-screen flex flex-col items-center justify-center p-8 relative">

        <!-- fundo pontilhado (mesmo padrão do auth_split.html) -->
        <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:16px_16px] opacity-20 pointer-events-none"></div>

        {% if not current_user.is_authenticated %}
        <div class="absolute top-4 right-4 z-20">
            <a href="{{ url_for('auth.login') }}"
               class="text-[11px] uppercase tracking-wider text-slate-400 hover:text-accentBlue
                      bg-slate-900/60 border border-slate-800 hover:border-accentBlue/50
                      px-3 py-1.5 rounded-full transition-colors">
                Guest · Sign in
            </a>
        </div>
        {% endif %}

        <div class="w-full max-w-5xl relative z-10">
            {% block content %}{% endblock %}
        </div>

    </div>

</body>
</html>
