<!-- EUFit/app/templates/auth/login.html -->
{% extends "layouts/auth_split.html" %}
{% block title %}Sign in — EUFit{% endblock %}

{% block form_content %}
<div class="mb-8 text-center">
    <h2 class="text-2xl font-bold tracking-tight text-white">Welcome to EUFit</h2>
    <p class="text-sm text-slate-400 mt-1">Sign in to your account</p>
</div>

<a href="{{ url_for('auth.google_login') }}"
   class="w-full flex items-center justify-center gap-3 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-medium py-3 rounded-lg transition duration-200 shadow-sm">
    <svg class="w-5 h-5" viewBox="0 0 24 24">
        ...
    </svg>
    Sign in with Google
</a>

<div class="flex items-center gap-3 my-6">
    <div class="flex-1 h-px bg-slate-700"></div>
    <span class="text-xs text-slate-500 uppercase tracking-wider">or</span>
    <div class="flex-1 h-px bg-slate-700"></div>
</div>

<a href="{{ url_for('dashboard.home') }}"
   class="w-full flex items-center justify-center gap-2 bg-transparent hover:bg-slate-800/50 border border-slate-700 text-slate-300 font-medium py-3 rounded-lg transition duration-200">
    Continue without login
</a>
{% endblock %}
